<body class="conn-websocket">

<!-- SERIAL NOT SUPPORTED WARNING -->
<div class="serial-unsupported-bar">⚠ Web Serial API not supported in this browser — use Chrome or Edge for USB/Serial connections</div>

<!-- THE SHELL (src/app) -->
<div id="app"></div>

<input type="file" id="fileInput" accept=".nc,.gcode,.g,.ngc,.tap" />

<!-- FLIGHT RECORDER: resume dialog -->
<div class="fr-modal-backdrop" id="frModal" style="display:none">
  <div class="fr-modal">
    <div class="fr-modal-head">✈ RESUME THE INTERRUPTED JOB<div style="flex:1"></div><button class="tb-btn" id="frModalClose">✕</button></div>
    <div class="fr-modal-body" id="frModalBody"></div>
  </div>
</div>

<!-- CARRIED-OVER PANELS. Held here until the shell moves each into its screen. -->
<div id="legacy" hidden>


  <!-- 3D VIEWPORT -->
  <div class="center-panel" id="vpPanel" style="flex:1">
    <div class="viewport-header">
      <span class="file-name" id="fileName">No file loaded</span>
      <button class="view-btn active" data-view="iso">ISO</button>
      <button class="view-btn" data-view="top">TOP</button>
      <button class="view-btn" data-view="front">FRONT</button>
      <button class="view-btn" data-view="side">SIDE</button>
      <button class="view-btn" id="btnFitView">FIT</button>
      <button class="view-btn" id="btnToolhead">TOOL ●</button>
      <button class="view-btn" id="btnWcsVis">WCS ○</button>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
      <span class="progress-text" id="progressText">0 / 0 lines</span>
    </div>

    <div class="viewport-wrap">
      <canvas id="threeCanvas"></canvas>
      <canvas id="rulerX" class="ruler ruler-x"></canvas>
      <canvas id="rulerY" class="ruler ruler-y"></canvas>
      <div class="viewport-stats" id="vpStats">
        X: 0.000&nbsp;&nbsp;Y: 0.000&nbsp;&nbsp;Z: 0.000<br>
        MOVES: 0&nbsp;&nbsp;RAPIDS: 0
      </div>
      <button class="vp-copy-btn" id="vpCopyBtn" title="Copy debug stats to clipboard">📋</button>

      <!-- Probe preview overlay -->
      <div class="pp-overlay" id="probePreviewOverlay" style="display:none;">
        <div class="pp-dro">
          <div class="pp-dro-row"><span class="pp-axis">X</span><span class="pp-val" id="ppDroX">—</span></div>
          <div class="pp-dro-row"><span class="pp-axis">Y</span><span class="pp-val" id="ppDroY">—</span></div>
          <div class="pp-dro-row"><span class="pp-axis">Z</span><span class="pp-val" id="ppDroZ">—</span></div>
          <div class="pp-label" id="ppDroLabel">—</div>
        </div>
        <div class="pp-controls">
          <button class="pp-btn" id="ppStepBck" title="Previous step" disabled>◀</button>
          <button class="pp-btn pp-btn-play" id="ppPlay" title="Play">▶</button>
          <button class="pp-btn" id="ppStepFwd" title="Next step" disabled>▶|</button>
          <span class="pp-counter" id="ppCounter">—</span>
          <button class="pp-btn pp-btn-close" id="ppClose" title="Close preview">✕</button>
        </div>
      </div>
    </div>

    <div class="viewport-legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--vp-cut)"></div>Cut</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--vp-rapid)"></div>Rapid</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--vp-executed)"></div>Current</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--vp-tool)"></div>Tool</div>
      <div class="legend-item" style="margin-left:auto;color:var(--text3);font-family:var(--mono);font-size:10px">Drag:Orbit · Scroll:Zoom · RClick:Pan</div>
    </div>

  </div><!-- /center-panel -->

  <!-- TOUCH KEYBOARD -->


</div><!-- /legacy -->

<!-- DEV-RELOAD -->
<script>
  const _ws = new WebSocket('ws://' + location.host + '/ws');
  _ws.onmessage = () => location.reload();
</script>
<!-- /DEV-RELOAD -->
<script src="/bundle.js" type="module"></script>
</body>
</html>
